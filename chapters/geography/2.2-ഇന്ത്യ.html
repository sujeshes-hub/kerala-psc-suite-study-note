<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2.2 India — Geography — Kerala PSC</title>
<link rel="stylesheet" href="../../assets/css/landing.css">
</head>
<body data-base="../../">

<header class="hero">
  <h1>🗺️ 2.2 India</h1>
  <p>ഇന്ത്യ — ഭൂമിശാസ്ത്രം</p>
</header>

<main>
  <div class="breadcrumb">
    <a href="../../index.html">🏠 Home</a> ›
    <a href="../../subjects/02-geography.html">Geography</a> ›
    <span>India</span>
  </div>

  <section>
    <div class="section-head"><h2>📝 Topics in this Chapter</h2></div>
    <div class="grid" id="topicGrid"><p style="color:var(--muted)">Loading…</p></div>
  </section>
</main>

<footer>Kerala PSC Study Suite · Works fully offline</footer>

<script src="../../assets/js/syllabus.js"></script>
<script>
(async () => {
  await Syllabus.load();
  const subject = Syllabus.getSubject('geography');
  const chapter = subject.chapters.find(c => c.id === '2.2');
  const grid = document.getElementById('topicGrid');
  if (!chapter) { grid.innerHTML = '<p>Chapter not found</p>'; return; }
  grid.innerHTML = chapter.topics.map(t => {
    const badge = t.tag === '573' ? '573 only' : t.tag === '883' ? '883 only' : 'BOTH';
    if (!t.file) {
      return `
        <div class="card" style="opacity:.72;cursor:default">
          <span class="badge">${t.id}</span>
          <h3>${t.title}</h3>
          <p class="desc">${t.titleMl || ''}</p>
          <div class="meta"><span>Coming soon</span><span>${badge}</span></div>
          <div class="bar"><i style="width:0%"></i></div>
        </div>`;
    }
    return `
      <a href="../../${t.file}" class="card" data-part="${t.key}" data-total="${t.qs}">
        <span class="badge">${t.id}</span>
        <h3>${t.title}</h3>
        <p class="desc">${t.titleMl || ''}</p>
        <div class="meta">
          <span>${t.qs} MCQs</span>
          <span>${badge}</span>
        </div>
        <div class="bar"><i></i></div>
        <div class="progressline"><span class="status">Not started</span><span class="score"></span></div>
      </a>`;
  }).join('');
  const s = document.createElement('script');
  s.src = '../../assets/js/sections.js';
  document.body.appendChild(s);
})();
</script>
</body>
</html>
