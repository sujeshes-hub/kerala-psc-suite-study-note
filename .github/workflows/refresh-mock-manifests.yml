name: Refresh mock-test manifests

# Keeps question-papers/*/list.js in step with the papers actually committed,
# so adding a paper is a one-step action: drop the file in and push.
# The listing pages read these manifests (they are what makes the lists work
# offline), and on GitHub Pages they additionally fold in anything the
# contents API reports as newer.

on:
  push:
    paths:
      - "question-papers/**/*.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-mock-manifests
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild manifests
        run: python tools/build_content.py

      # Advisory only: a red audit must not stop the manifests from being
      # committed, or a new paper would stay unlisted until someone looked.
      - name: Verify the site is still consistent
        continue-on-error: true
        run: python tools/site_audit.py

      - name: Commit changed manifests
        run: |
          if [ -z "$(git status --porcelain -- question-papers)" ]; then
            echo "Manifests already current."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- question-papers/*/list.js
          # No [skip ci]: this commit must still trigger the Pages deploy.
          # The job cannot loop, because its trigger only matches *.html files.
          git commit -m "chore: refresh mock-test manifests"
          git push
