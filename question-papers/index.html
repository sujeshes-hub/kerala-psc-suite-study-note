<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock Tests – Kerala PSC</title>
<style>
  body{font-family:'Noto Sans Malayalam','Segoe UI',system-ui,sans-serif;
       background:#f4f6f9;margin:0;padding:24px;color:#1a1a2e}
  .wrap{max-width:900px;margin:0 auto}
  h1{color:#2c3e8f;margin-bottom:8px}
  .sub{color:#5b6b85;margin-bottom:8px;font-size:.92rem}
  .hint{color:#8a8f9e;font-size:.75rem;margin-bottom:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
        gap:14px}
  .card{background:#fff;border-radius:12px;padding:18px;
        box-shadow:0 2px 12px rgba(0,0,0,.08);text-decoration:none;
        color:inherit;border-top:4px solid #2c3e8f;
        transition:transform .15s;display:block}
  .card:hover{transform:translateY(-3px)}
  .card.html{border-top-color:#0e7490}
  .card h3{margin:0 0 6px;font-size:1rem;color:#2c3e8f}
  .card.html h3{color:#0e7490}
  .card .ml{font-size:.85rem;color:#5b6b85;margin-bottom:8px}
  .card .meta{font-size:.78rem;color:#8a8f9e;text-transform:uppercase;
              font-weight:600}
  .card .kind{float:right;font-size:.66rem;font-weight:700;letter-spacing:.04em;
              background:#eef2f9;color:#5b6b85;border-radius:999px;
              padding:2px 8px;text-transform:uppercase}
  .card.html .kind{background:#e6f7fb;color:#0e7490}
  .empty{padding:20px;text-align:center;color:#8a8f9e;font-size:.9rem;
         background:#fff;border:1px dashed #d0d4de;border-radius:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📝 Mock Tests</h1>
  <p class="sub">ഒരു പേപ്പർ തിരഞ്ഞെടുത്ത് പരീക്ഷ ആരംഭിക്കുക</p>
  <p class="hint" id="hint"></p>
  <div class="grid" id="grid">Loading…</div>
</div>

<!-- Generated by tools/build_content.py: lists every paper in this folder -->
<script src="papers.js"></script>
<script>
(function(){
  var grid   = document.getElementById('grid');
  var hint   = document.getElementById('hint');
  var papers = (window.KPSC_PAPERS || []).slice();
  var seen   = {};
  papers.forEach(function(p){ seen[p.file || p.data || p.url] = 1; });

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function card(p){
    var isData = p.kind !== 'html';
    var meta = [];
    if (p.qs) meta.push(p.qs + ' Q');
    if (p.duration) meta.push(p.duration + ' min');
    if (p.tag && p.tag !== 'BOTH') meta.push(p.tag);
    if (p.updated) meta.push(p.updated);
    return '<a class="card ' + (isData ? 'data' : 'html') + '" href="' + esc(p.url) + '">' +
             '<span class="kind">' + (isData ? 'JSON' : 'HTML') + '</span>' +
             '<h3>' + esc(p.title || p.file) + '</h3>' +
             '<div class="ml">' + esc(p.titleMl || '') + '</div>' +
             '<div class="meta">' + esc(meta.join(' · ')) + '</div>' +
           '</a>';
  }

  function render(list){
    if (!list.length){
      grid.innerHTML = '<p class="empty">No papers found in <code>question-papers/</code>.<br>' +
                       'Add a <code>.json</code> or <code>.html</code> file and rebuild.</p>';
      return;
    }
    grid.innerHTML = list.map(card).join('');
    hint.textContent = list.length + ' paper(s) discovered in question-papers/';
  }

  render(papers);

  /* ------------------------------------------------------------------
     On GitHub Pages the folder can be listed through the contents API.
     Anything uploaded after the last build is folded in here, so a new
     paper shows up without a rebuild.  Offline (file://) this call
     simply fails and the generated index above stands.
     ------------------------------------------------------------------ */
  function detectRepo(){
    var host = location.hostname, parts = location.pathname.split('/').filter(Boolean);
    if (!host.endsWith('.github.io') || parts.length < 1) return null;
    return { owner: host.replace('.github.io',''), repo: parts[0] };
  }

  function metaFromFilename(name){
    return name.replace(/\.html?$/i, '').replace(/^qp-[a-z0-9]+-/i, '')
               .replace(/[-_]+/g, ' ').trim();
  }

  function supplement(){
    var repo = detectRepo();
    if (!repo) return;
    var base = 'https://api.github.com/repos/' + repo.owner + '/' + repo.repo + '/contents/';
    var folders = ['question-papers', 'question-papers/573', 'question-papers/883',
                   'question-papers/subjects'];
    Promise.all(folders.map(function(f){
      return fetch(base + f + '?ref=main', { headers: { Accept: 'application/vnd.github+json' } })
        .then(function(r){ return r.ok ? r.json() : []; })
        .catch(function(){ return []; });
    })).then(function(groups){
      var extras = [];
      groups.forEach(function(files, gi){
        if (!Array.isArray(files)) return;
        var folder = folders[gi].replace(/^question-papers\/?/, '');
        files.forEach(function(f){
          if (f.type !== 'file' || !/\.(json|html?)$/i.test(f.name)) return;
          if (f.name.toLowerCase() === 'index.html') return;
          if (gi === 0 && !/\.json$/i.test(f.name)) return;   /* top level: data papers only */
          var key = (folder ? folder + '/' : '') + f.name;
          if (seen[key] || seen[f.name]) return;
          seen[key] = 1;
          extras.push({ name: f.name, folder: folder, kind: /\.json$/i.test(f.name) ? 'json' : 'html' });
        });
      });
      if (!extras.length) return;
      return Promise.all(extras.map(function(e){
        var rel = (e.folder ? e.folder + '/' : '') + e.name;
        if (e.kind === 'json'){
          return fetch('question-papers/' + encodeURI(rel), { cache: 'no-cache' })
            .then(function(r){ return r.ok ? r.json() : null; })
            .then(function(d){
              if (!d || !Array.isArray(d.questions)) return null;
              var spq = d.secondsPerQuestion || 45;
              return { id: d.id || rel, kind: 'json', title: d.title || metaFromFilename(e.name),
                       titleMl: d.titleMl || '', qs: d.questions.length,
                       duration: d.questions.length ? Math.round(d.questions.length * spq / 60) : 0,
                       tag: d.tag || 'BOTH',
                       url: '../mock-test.html?paper=' + encodeURIComponent('question-papers/' + rel) };
            }).catch(function(){ return null; });
        }
        return { id: rel, kind: 'html', title: metaFromFilename(e.name), qs: 0, duration: 0,
                 tag: 'BOTH', url: encodeURI(e.folder + '/' + e.name) };
      })).then(function(list){
        var add = list.filter(Boolean);
        if (!add.length) return;
        render(add.concat(papers));
      });
    }).catch(function(){ /* offline: the generated index stands */ });
  }

  supplement();
})();
</script>
</body>
</html>
