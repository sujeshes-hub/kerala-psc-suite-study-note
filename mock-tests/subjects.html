<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subject-wise Mock Tests — Kerala PSC</title>
<link rel="stylesheet" href="../assets/css/landing.css">
<style>
/* =====================================================================
   Subject-wise Mock Tests — Modern UI + Light / Sepia / Dark Themes
   ===================================================================== */
:root {
  --bg: #f1f5f9;
  --surface-2: #f8fafc;
  --card: #ffffff;
  --ink: #0f172a;
  --muted: #64748b;
  --brand: #0b5d63;
  --brand2: #0f8a8f;
  --brand-soft: #e6f5f5;
  --line: #e2e8f0;
  --ok: #15803d;
  --ok-bg: #ecfdf5;
  --shadow: 0 2px 10px rgba(15, 23, 42, 0.05), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 14px 28px rgba(11, 93, 99, 0.14), 0 4px 10px rgba(15, 23, 42, 0.06);
  --radius: 18px;
}

html[data-theme="sepia"] {
  --bg: #f4ecd8;
  --surface-2: #efe4ca;
  --card: #fbf6e9;
  --ink: #2c2418;
  --muted: #6b5d47;
  --brand: #0b5d63;
  --brand2: #128a8f;
  --brand-soft: #e6eadc;
  --line: #dfd2b5;
  --ok-bg: #e7f2e3;
  --shadow: 0 2px 10px rgba(44, 36, 24, 0.06);
  --shadow-lg: 0 14px 26px rgba(44, 36, 24, 0.12);
}

html[data-theme="dark"] {
  --bg: #0b1220;
  --surface-2: #111c2e;
  --card: #152236;
  --ink: #f1f5f9;
  --muted: #94a3b8;
  --brand: #2dd4bf;
  --brand2: #14b8a6;
  --brand-soft: rgba(45, 212, 191, 0.12);
  --line: #23334d;
  --ok: #4ade80;
  --ok-bg: rgba(34, 197, 94, 0.14);
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 16px 32px rgba(0, 0, 0, 0.48);
}

body {
  background: var(--bg);
  color: var(--ink);
  transition: background-color 0.25s ease, color 0.25s ease;
}

/* ---------- HERO ---------- */
.hero {
  position: relative;
  padding: 2.3rem 1.2rem 3.1rem;
  background:
    radial-gradient(circle at 14% 20%, rgba(45, 212, 191, 0.25) 0%, transparent 45%),
    radial-gradient(circle at 86% 24%, rgba(250, 204, 21, 0.15) 0%, transparent 40%),
    linear-gradient(135deg, #073f45 0%, #0b5d63 50%, #0f8a8f 100%);
  box-shadow: 0 10px 30px rgba(7, 63, 69, 0.25);
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px);
  background-size: 22px 22px;
  pointer-events: none;
  opacity: 0.4;
}

.hero::after {
  height: 26px;
  border-radius: 26px 26px 0 0;
  background: var(--bg);
  transition: background-color 0.25s ease;
}

.hero-inner {
  position: relative;
  z-index: 2;
  max-width: 980px;
  margin: 0 auto;
}

.hero-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
  margin-bottom: 1.15rem;
}

.hero-topbar .back-btn {
  position: static;
}

.theme-switch {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.22);
  border: 1px solid rgba(255, 255, 255, 0.22);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.theme-switch button {
  border: 0;
  background: transparent;
  color: rgba(255, 255, 255, 0.85);
  font-family: inherit;
  font-size: 0.74rem;
  font-weight: 700;
  padding: 0.3rem 0.65rem;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.18s ease, color 0.18s ease;
}

.theme-switch button:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.12);
}

.theme-switch button.active {
  background: #ffffff;
  color: #0b5d63;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
}

.hero h1 {
  font-size: clamp(1.55rem, 3.2vw, 2.15rem);
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 0.35rem;
}

.hero-stats {
  margin-top: 1.15rem;
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  justify-content: center;
}

.hero-stats span {
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(255, 255, 255, 0.26);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  padding: 0.32rem 0.82rem;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 700;
  color: #ffffff;
}

/* ---------- MAIN ---------- */
main {
  max-width: 1160px;
  padding: 0.2rem 1.1rem 4rem;
}

.breadcrumb {
  color: var(--muted);
}

.breadcrumb span {
  color: var(--ink);
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.65rem;
  margin-bottom: 0.9rem;
}

.section-title-group {
  display: flex;
  align-items: center;
  gap: 0.55rem;
}

.section-head h2 {
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
}

.section-head h2::before {
  content: "";
  width: 4px;
  height: 1.15em;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--brand), var(--brand2));
}

.count-pill {
  font-size: 0.74rem;
  font-weight: 700;
  color: var(--brand);
  background: var(--brand-soft);
  padding: 0.18rem 0.62rem;
  border-radius: 999px;
}

.head-actions {
  display: flex;
  gap: 0.45rem;
  flex-wrap: wrap;
  align-items: center;
}

.btn {
  background: var(--card);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0.48rem 0.9rem;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  transition: all 0.16s ease;
}

.btn:hover {
  border-color: var(--brand2);
  background: var(--surface-2);
}

.btn.accent {
  background: linear-gradient(135deg, #0b5d63, #128a8f);
  color: #ffffff;
  border-color: transparent;
  box-shadow: 0 4px 12px rgba(11, 93, 99, 0.22);
}

.btn.accent:hover {
  filter: brightness(1.06);
  transform: translateY(-1px);
}

/* ---------- CONTROLS PANEL ---------- */
.controls-panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 0.75rem 0.85rem;
  margin-bottom: 1.15rem;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
}

.controls-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.6rem;
}

.search-wrap {
  position: relative;
  flex: 1 1 250px;
  display: flex;
  align-items: center;
}

.search-wrap .s-ico {
  position: absolute;
  left: 0.75rem;
  font-size: 0.9rem;
  opacity: 0.65;
  pointer-events: none;
}

.search-wrap input {
  width: 100%;
  font-family: inherit;
  font-size: 0.86rem;
  padding: 0.5rem 2rem 0.5rem 2.15rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--ink);
  outline: none;
  transition: border-color 0.16s ease, box-shadow 0.16s ease;
}

.search-wrap input:focus {
  border-color: var(--brand2);
  box-shadow: 0 0 0 3px rgba(15, 138, 143, 0.14);
}

.search-wrap .clear-btn {
  position: absolute;
  right: 0.45rem;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 1rem;
  cursor: pointer;
  padding: 2px 6px;
  display: none;
}

.search-wrap .clear-btn.show {
  display: inline-block;
}

.ctrl-select {
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 700;
  padding: 0.48rem 0.75rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--ink);
  cursor: pointer;
}

.seg-group {
  display: inline-flex;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 2px;
  gap: 2px;
}

.seg-btn {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 0.78rem;
  font-weight: 700;
  padding: 0.36rem 0.7rem;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s ease;
}

.seg-btn:hover {
  color: var(--ink);
}

.seg-btn.active {
  background: var(--brand);
  color: #ffffff;
}

html[data-theme="dark"] .seg-btn.active {
  color: #062528;
}

.chip-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4rem;
  padding-top: 0.55rem;
  border-top: 1px dashed var(--line);
}

.chip-label {
  font-size: 0.74rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  color: var(--muted);
  margin-right: 0.2rem;
}

.fchip {
  font-family: inherit;
  font-size: 0.77rem;
  font-weight: 700;
  padding: 0.32rem 0.72rem;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--muted);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.32rem;
  transition: all 0.15s ease;
}

.fchip:hover {
  border-color: var(--brand2);
  color: var(--ink);
}

.fchip.active {
  background: var(--brand);
  border-color: var(--brand);
  color: #ffffff;
}

html[data-theme="dark"] .fchip.active {
  color: #062528;
}

.fchip .sub-cnt {
  font-size: 0.7rem;
  opacity: 0.82;
}

.collapse-tools {
  margin-left: auto;
  display: inline-flex;
  gap: 0.35rem;
}

.mini-link {
  border: 0;
  background: transparent;
  color: var(--brand);
  font-family: inherit;
  font-size: 0.76rem;
  font-weight: 700;
  cursor: pointer;
  padding: 0.2rem 0.45rem;
  border-radius: 6px;
}

.mini-link:hover {
  background: var(--brand-soft);
}

/* ---------- RANDOM PICK BANNER ---------- */
.pick-banner {
  display: none;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
  background: var(--card);
  border: 1px solid var(--brand2);
  border-left: 5px solid var(--brand2);
  border-radius: 14px;
  padding: 0.75rem 1rem;
  margin-bottom: 1rem;
  box-shadow: var(--shadow);
}

.pick-banner.show {
  display: flex;
}

.pick-banner .pick-txt {
  flex: 1 1 220px;
  font-size: 0.86rem;
}

.pick-banner .pick-txt b {
  color: var(--brand);
}

.pick-banner .pick-open {
  background: linear-gradient(135deg, #0b5d63, #128a8f);
  color: #ffffff;
  text-decoration: none;
  font-weight: 700;
  font-size: 0.8rem;
  padding: 0.44rem 0.9rem;
  border-radius: 9px;
}

.pick-banner .pick-close {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 1.15rem;
  cursor: pointer;
  padding: 0 4px;
}

/* ---------- SUBJECT GROUPS ---------- */
.subj-block {
  margin-bottom: 1.7rem;
}

.subj-head {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  margin-bottom: 0.85rem;
  padding: 0.65rem 0.9rem;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  cursor: pointer;
  user-select: none;
  transition: border-color 0.16s ease, background 0.16s ease;
}

.subj-head:hover {
  border-color: var(--brand2);
}

.subj-head .ico {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--brand-soft);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  flex: 0 0 36px;
}

.subj-head h3 {
  margin: 0;
  font-size: 1.03rem;
  color: var(--ink);
  font-weight: 800;
}

.subj-head .ml {
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 600;
}

.subj-head .cnt {
  background: var(--brand-soft);
  color: var(--brand);
  font-size: 0.74rem;
  font-weight: 800;
  padding: 0.22rem 0.65rem;
  border-radius: 999px;
  margin-left: auto;
  white-space: nowrap;
}

.subj-head .arw {
  color: var(--muted);
  font-size: 0.95rem;
  transition: transform 0.2s ease;
}

.subj-block.collapsed .subj-head .arw {
  transform: rotate(-90deg);
}

.subj-block.collapsed .grid {
  display: none;
}

/* ---------- CARDS ---------- */
.grid {
  grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
  gap: 0.95rem;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.05rem 1.15rem;
  box-shadow: var(--shadow);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
  border-color: var(--brand2);
}

.card.picked-flash {
  border-color: var(--brand2);
  box-shadow: 0 0 0 4px rgba(15, 138, 143, 0.28), var(--shadow-lg);
}

.card-badges {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.45rem;
  flex-wrap: wrap;
  margin-bottom: 0.55rem;
}

.card .badge {
  position: static;
  font-size: 0.7rem;
  font-weight: 800;
  padding: 0.18rem 0.58rem;
  border-radius: 999px;
  background: var(--brand-soft);
  color: var(--brand);
}

.card .badge.c573 {
  background: rgba(234, 88, 12, 0.14);
  color: #c2410c;
}

.card .badge.c883 {
  background: rgba(109, 40, 217, 0.14);
  color: #6d28d9;
}

.card .badge.new-pill {
  background: var(--ok-bg);
  color: var(--ok);
}

.card .badge.subj-pill {
  background: var(--surface-2);
  color: var(--muted);
  border: 1px solid var(--line);
}

html[data-theme="dark"] .card .badge.c573 {
  background: rgba(251, 146, 60, 0.18);
  color: #fdba74;
}

html[data-theme="dark"] .card .badge.c883 {
  background: rgba(167, 139, 250, 0.18);
  color: #c4b5fd;
}

.card h3 {
  font-size: 1rem;
  font-weight: 800;
  color: var(--ink);
  margin: 0 0 0.35rem;
  padding-right: 0;
  line-height: 1.35;
}

.card .file-name {
  display: inline-block;
  max-width: 100%;
  margin: 0 0 0.5rem;
  padding: 0.18rem 0.52rem;
  border-radius: 7px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--muted);
  font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace;
  font-size: 0.72rem;
  line-height: 1.35;
  overflow-wrap: anywhere;
  word-break: break-word;
}

.card .desc {
  font-size: 0.82rem;
  color: var(--muted);
  margin: 0 0 0.7rem;
  min-height: 0;
  flex: 1;
}

.card .meta {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  margin-bottom: 0.55rem;
}

.card .meta span {
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 0.74rem;
  font-weight: 600;
  padding: 0.15rem 0.5rem;
  border-radius: 6px;
}

.card .bar {
  background: var(--surface-2);
}

.card .progressline {
  color: var(--muted);
}

.empty-msg {
  padding: 24px 18px;
  text-align: center;
  color: var(--muted);
  font-size: 0.9rem;
  background: var(--card);
  border: 1px dashed var(--line);
  border-radius: 14px;
}

.empty-msg code {
  background: var(--surface-2);
  padding: 2px 6px;
  border-radius: 5px;
  font-size: 0.82rem;
  color: var(--ink);
}

footer {
  margin-top: 1.5rem;
  border-top: 1px solid var(--line);
  color: var(--muted);
}

@media (max-width: 600px) {
  .hero {
    padding: 1.35rem 0.95rem 2.5rem;
  }
  main {
    padding: 0.1rem 0.85rem 3.5rem;
  }
  .subj-head {
    padding: 0.55rem 0.7rem;
  }
  .subj-head .ml {
    display: none;
  }
  .collapse-tools {
    margin-left: 0;
  }
}

@media print {
  .theme-switch, .controls-panel, .head-actions, .pick-banner {
    display: none !important;
  }
}
</style>
<script>
(function () {
  try {
    var saved = localStorage.getItem("kpsc_theme");
    if (saved === "dark" || saved === "sepia" || saved === "light") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="hero-topbar">
      <button class="back-btn" type="button" onclick="location.href='../index.html'">← Back</button>
      <div class="theme-switch" role="group" aria-label="Reading theme">
        <button type="button" data-set-theme="light">☀️ Light</button>
        <button type="button" data-set-theme="sepia">📜 Sepia</button>
        <button type="button" data-set-theme="dark">🌙 Dark</button>
      </div>
    </div>

    <h1>📚 Subject-wise Mock Tests</h1>
    <p>വിഷയാടിസ്ഥാന മോക്ക് ടെസ്റ്റുകൾ · Sorted newest update first</p>

    <div class="hero-stats" id="heroStats">
      <span id="statSubjects">0 Subjects</span>
      <span id="statPapers">0 Papers</span>
      <span id="statQs">0 MCQs</span>
      <span id="statLatest">Latest: —</span>
    </div>
  </div>
</header>

<main>
  <div class="breadcrumb">
    <a href="../index.html">🏠 Home</a> ›
    <span>Subject-wise Mock Tests</span>
  </div>

  <section>
    <div class="section-head">
      <div class="section-title-group">
        <h2>Papers by Subject</h2>
        <span class="count-pill" id="visibleCountPill">Loading…</span>
      </div>
      <div class="head-actions">
        <button class="btn accent" id="randomPaperBtn" type="button">🎲 Random Pick</button>
        <button class="btn ghost" id="refreshPapers" type="button">↻ Refresh list</button>
      </div>
    </div>

    <div class="controls-panel">
      <div class="controls-row">
        <div class="search-wrap">
          <span class="s-ico">🔎</span>
          <input type="search" id="paperSearch" placeholder="Search title, filename, or subject (English / മലയാളം)…" autocomplete="off">
          <button type="button" class="clear-btn" id="clearSearch" aria-label="Clear search">&times;</button>
        </div>

        <select id="sortSelect" class="ctrl-select" aria-label="Sort papers">
          <option value="newest" selected>Sort: Newest updated</option>
          <option value="oldest">Sort: Oldest updated</option>
          <option value="title">Sort: Title (A–Z)</option>
          <option value="qs">Sort: Most questions</option>
        </select>

        <div class="seg-group" id="viewSwitch" role="group" aria-label="Layout view">
          <button type="button" class="seg-btn active" data-view="grouped">Grouped</button>
          <button type="button" class="seg-btn" data-view="flat">All Latest</button>
        </div>
      </div>

      <div class="chip-bar">
        <span class="chip-label">Exam:</span>
        <button type="button" class="fchip active" data-exam="ALL">All</button>
        <button type="button" class="fchip" data-exam="573">573/2025</button>
        <button type="button" class="fchip" data-exam="883">883/2025</button>

        <div class="collapse-tools" id="collapseTools">
          <button type="button" class="mini-link" id="expandAllBtn">Expand all</button>
          <button type="button" class="mini-link" id="collapseAllBtn">Collapse all</button>
        </div>
      </div>

      <div class="chip-bar" id="subjectChipBar" style="display:none"></div>
    </div>

    <div class="pick-banner" id="pickBanner">
      <div class="pick-txt" id="pickText"></div>
      <a href="#" class="pick-open" id="pickOpenLink">Open paper →</a>
      <button type="button" class="pick-close" id="pickCloseBtn" aria-label="Close">&times;</button>
    </div>

    <div id="subjectHost">
      <p class="empty">Loading…</p>
    </div>
  </section>
</main>

<footer>Kerala PSC Study Suite · Works fully offline</footer>

<script src="../question-papers/subjects/list.js"></script>
<script>
(function () {
  /* ================= CONFIG ================= */
  var FOLDER    = "question-papers/subjects";
  var BASE_PATH = "../question-papers/subjects/";
  var CACHE_KEY = "kpsc_subject_papers_v2";
  var CACHE_TTL = 1000 * 60 * 30;
  var RECENT_MS = 1000 * 60 * 60 * 24 * 7; /* 7 days */

  var SUBJECT_META = {
    "History":         { icon: "📜", ml: "ചരിത്രം",                order: 1 },
    "Geography":       { icon: "🌍", ml: "ഭൂമിശാസ്ത്രം",           order: 2 },
    "Economics":       { icon: "💰", ml: "സാമ്പത്തിക ശാസ്ത്രം",     order: 3 },
    "Constitution":    { icon: "🏛️", ml: "ഭരണഘടന",                 order: 4 },
    "Kerala Admin":    { icon: "🏢", ml: "കേരള ഭരണം",              order: 5 },
    "Biology":         { icon: "🔬", ml: "ജീവശാസ്ത്രം",            order: 6 },
    "Physics":         { icon: "⚛️", ml: "ഭൗതികശാസ്ത്രം",           order: 7 },
    "Chemistry":       { icon: "🧪", ml: "രസതന്ത്രം",              order: 8 },
    "Arts & Sports":   { icon: "🎭", ml: "കലയും കായികവും",          order: 9 },
    "Computer":        { icon: "💻", ml: "കമ്പ്യൂട്ടർ",             order: 10 },
    "Arithmetic":      { icon: "🔢", ml: "ലഘുഗണിതം",               order: 11 },
    "Mental Ability":  { icon: "🧠", ml: "മാനസിക ശേഷി",           order: 12 },
    "English":         { icon: "📖", ml: "ഇംഗ്ലീഷ്",               order: 13 },
    "Malayalam":       { icon: "✍️", ml: "മലയാളം",                 order: 14 },
    "Current Affairs": { icon: "📰", ml: "കറന്റ് അഫയേഴ്സ്",         order: 15 },
    "Important Acts":  { icon: "⚖️", ml: "പ്രധാന നിയമങ്ങൾ",        order: 16 },
    "Legal Metrology": { icon: "📐", ml: "ലീഗൽ മെട്രോളജി",         order: 17 },
    "Uncategorised":   { icon: "📄", ml: "മറ്റുള്ളവ",               order: 99 }
  };

  /* ================= DOM ================= */
  var host            = document.getElementById("subjectHost");
  var refreshBtn      = document.getElementById("refreshPapers");
  var randomBtn       = document.getElementById("randomPaperBtn");
  var searchInput     = document.getElementById("paperSearch");
  var clearSearchBtn  = document.getElementById("clearSearch");
  var sortSelect      = document.getElementById("sortSelect");
  var viewSwitch      = document.getElementById("viewSwitch");
  var subjectChipBar  = document.getElementById("subjectChipBar");
  var collapseTools   = document.getElementById("collapseTools");
  var expandAllBtn    = document.getElementById("expandAllBtn");
  var collapseAllBtn  = document.getElementById("collapseAllBtn");
  var visibleCountEl  = document.getElementById("visibleCountPill");
  var pickBanner      = document.getElementById("pickBanner");
  var pickText        = document.getElementById("pickText");
  var pickOpenLink    = document.getElementById("pickOpenLink");
  var pickCloseBtn    = document.getElementById("pickCloseBtn");

  var state = {
    allItems: [],
    query: "",
    exam: "ALL",
    subject: "ALL",
    sort: "newest",
    view: "grouped",
    collapsed: {}
  };

  /* ================= THEME ================= */
  var themeBtns = document.querySelectorAll("[data-set-theme]");
  function applyTheme(mode) {
    var t = (mode === "dark" || mode === "sepia") ? mode : "light";
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("kpsc_theme", t); } catch (e) {}
    themeBtns.forEach(function (b) {
      b.classList.toggle("active", b.dataset.setTheme === t);
    });
  }
  applyTheme(document.documentElement.getAttribute("data-theme") || "light");
  themeBtns.forEach(function (b) {
    b.addEventListener("click", function () { applyTheme(b.dataset.setTheme); });
  });

  /* ================= UTIL ================= */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function safeHref(file) {
    return BASE_PATH + String(file || "").split("/").map(encodeURIComponent).join("/");
  }

  function detectRepo() {
    var hostName = location.hostname;
    var parts = location.pathname.split("/").filter(Boolean);
    if (!hostName.endsWith(".github.io") || parts.length < 1) return null;
    return { owner: hostName.replace(".github.io", ""), repo: parts[0] };
  }

  function readCache() {
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || !o.ts || (Date.now() - o.ts) > CACHE_TTL) return null;
      return o.items || null;
    } catch (e) { return null; }
  }
  function saveCache(items) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), items: items })); } catch (e) {}
  }

  /* ================= DATES & SORTING ================= */
  function getRawUpdated(item) {
    if (!item) return "";
    return item.updated || item.updatedAt || item.updateDate ||
           item.lastUpdated || item.date || "";
  }

  function parseDateMs(raw) {
    if (!raw) return 0;
    if (typeof raw === "number") return isFinite(raw) ? raw : 0;

    var str = String(raw).trim();
    if (!str) return 0;

    if (/^\d{4}-\d{2}-\d{2}T.*(?:Z|[+\-]\d{2}:?\d{2})$/i.test(str)) {
      var iso = Date.parse(str);
      if (!isNaN(iso)) return iso;
    }

    var ymd = str.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
    if (ymd) {
      return new Date(
        Number(ymd[1]), Number(ymd[2]) - 1, Number(ymd[3]),
        Number(ymd[4] || 0), Number(ymd[5] || 0), Number(ymd[6] || 0)
      ).getTime();
    }

    var dmy = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
    if (dmy) {
      return new Date(
        Number(dmy[3]), Number(dmy[2]) - 1, Number(dmy[1]),
        Number(dmy[4] || 0), Number(dmy[5] || 0), Number(dmy[6] || 0)
      ).getTime();
    }

    var ts = Date.parse(str);
    return isNaN(ts) ? 0 : ts;
  }

  function formatDisplayDate(raw) {
    if (!raw) return "";
    var str = String(raw).trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
    var ms = parseDateMs(str);
    if (!ms) return str;
    var d = new Date(ms);
    return d.getFullYear() + "-" +
           String(d.getMonth() + 1).padStart(2, "0") + "-" +
           String(d.getDate()).padStart(2, "0");
  }

  function isRecent(raw) {
    var ms = parseDateMs(raw);
    if (!ms) return false;
    var diff = Date.now() - ms;
    return diff >= -86400000 && diff <= RECENT_MS;
  }

  function titleFromFilename(name) {
    return String(name || "")
      .replace(/\.html?$/i, "")
      .replace(/^qp-[a-z]+-/, "")
      .replace(/[-_]+/g, " ")
      .replace(/\b\w/g, function (c) { return c.toUpperCase(); });
  }

  function byUpdated(a, b) {
    var ta = parseDateMs(getRawUpdated(a));
    var tb = parseDateMs(getRawUpdated(b));
    if (ta !== tb) return tb - ta;
    return (a.file || "").localeCompare(b.file || "");
  }

  function comparator(mode) {
    if (mode === "oldest") {
      return function (a, b) {
        var ta = parseDateMs(getRawUpdated(a));
        var tb = parseDateMs(getRawUpdated(b));
        if (ta !== tb) return ta - tb;
        return (a.file || "").localeCompare(b.file || "");
      };
    }
    if (mode === "title") {
      return function (a, b) {
        var ta = (a.title || titleFromFilename(a.file)).toLowerCase();
        var tb = (b.title || titleFromFilename(b.file)).toLowerCase();
        return ta.localeCompare(tb);
      };
    }
    if (mode === "qs") {
      return function (a, b) {
        var diff = (Number(b.qs) || 0) - (Number(a.qs) || 0);
        return diff !== 0 ? diff : byUpdated(a, b);
      };
    }
    return byUpdated;
  }

  /* ================= FETCH ================= */
  async function fetchFolderList() {
    var repo = detectRepo();
    if (!repo) throw new Error("Not on GitHub Pages — folder listing unavailable.");
    var url = "https://api.github.com/repos/" + repo.owner + "/" + repo.repo +
              "/contents/" + FOLDER + "?ref=main";
    var res = await fetch(url, { headers: { "Accept": "application/vnd.github+json" } });
    if (!res.ok) throw new Error("GitHub API: HTTP " + res.status);
    var files = await res.json();
    if (!Array.isArray(files)) throw new Error("Unexpected API response");
    return files.filter(function (f) {
      return f.type === "file" &&
             /\.html?$/i.test(f.name) &&
             f.name.toLowerCase() !== "index.html";
    });
  }

  async function fetchCommitDate(repo, filename) {
    if (!repo) return "";
    try {
      var url = "https://api.github.com/repos/" + repo.owner + "/" + repo.repo +
                "/commits?path=" + encodeURIComponent(FOLDER + "/" + filename) + "&per_page=1";
      var res = await fetch(url, { headers: { "Accept": "application/vnd.github+json" } });
      if (!res.ok) return "";
      var commits = await res.json();
      if (Array.isArray(commits) && commits[0] && commits[0].commit) {
        return (commits[0].commit.committer && commits[0].commit.committer.date) ||
               (commits[0].commit.author && commits[0].commit.author.date) || "";
      }
    } catch (e) {}
    return "";
  }

  async function readMeta(filename, force, repo) {
    try {
      var res = await fetch(safeHref(filename), { cache: force ? "no-cache" : "default" });
      if (!res.ok) return {};
      var lastMod = res.headers.get("Last-Modified") || "";
      var text = await res.text();
      var doc  = new DOMParser().parseFromString(text, "text/html");
      function meta(name) {
        var el = doc.querySelector('meta[name="' + name + '"]');
        return el ? el.getAttribute("content") : "";
      }
      var updated = meta("mock:updated") || meta("mock:update-date") ||
                    meta("mock:date") || "";
      if (!updated && repo) {
        updated = await fetchCommitDate(repo, filename);
      }
      if (!updated) updated = lastMod;
      return {
        title:    meta("mock:title")    || "",
        titleMl:  meta("mock:title-ml") || "",
        desc:     meta("mock:desc")     || "",
        duration: parseInt(meta("mock:duration"), 10) || 0,
        qs:       parseInt(meta("mock:qs"), 10)       || 0,
        tag:      meta("mock:tag")      || "BOTH",
        key:      meta("mock:key")      || "",
        subject:  meta("mock:subject")  || "Uncategorised",
        updated:  updated
      };
    } catch (e) { return {}; }
  }

  /* ================= FILTERING & STATS ================= */
  function sortSubjectNames(names) {
    return names.sort(function (a, b) {
      var oa = (SUBJECT_META[a] && SUBJECT_META[a].order) || 999;
      var ob = (SUBJECT_META[b] && SUBJECT_META[b].order) || 999;
      if (oa !== ob) return oa - ob;
      return a.localeCompare(b);
    });
  }

  function updateHeroStats(items) {
    var subjSet = {};
    var totalQs = 0;
    var latestMs = 0;
    var latestRaw = "";

    items.forEach(function (p) {
      subjSet[p.subject || "Uncategorised"] = 1;
      totalQs += Number(p.qs) || 0;
      var raw = getRawUpdated(p);
      var ms = parseDateMs(raw);
      if (ms > latestMs) { latestMs = ms; latestRaw = raw; }
    });

    var subjCount = Object.keys(subjSet).length;
    document.getElementById("statSubjects").textContent = subjCount + " Subject" + (subjCount === 1 ? "" : "s");
    document.getElementById("statPapers").textContent   = items.length + " Paper" + (items.length === 1 ? "" : "s");
    document.getElementById("statQs").textContent       = totalQs.toLocaleString() + " MCQs";
    document.getElementById("statLatest").textContent   = "Latest: " + (latestRaw ? formatDisplayDate(latestRaw) : "—");
  }

  function renderSubjectChips(items) {
    if (!items.length) {
      subjectChipBar.style.display = "none";
      return;
    }
    var counts = {};
    items.forEach(function (p) {
      var s = p.subject || "Uncategorised";
      counts[s] = (counts[s] || 0) + 1;
    });
    var subjects = sortSubjectNames(Object.keys(counts));
    if (state.subject !== "ALL" && !counts[state.subject]) state.subject = "ALL";

    var html = '<span class="chip-label">Subject:</span>' +
      '<button type="button" class="fchip' + (state.subject === "ALL" ? " active" : "") + '" data-subject="ALL">All Subjects <span class="sub-cnt">(' + items.length + ')</span></button>';

    subjects.forEach(function (s) {
      var meta = SUBJECT_META[s] || { icon: "📄" };
      html += '<button type="button" class="fchip' + (state.subject === s ? " active" : "") + '" data-subject="' + esc(s) + '">' +
        meta.icon + ' ' + esc(s) + ' <span class="sub-cnt">(' + counts[s] + ')</span>' +
      '</button>';
    });

    subjectChipBar.innerHTML = html;
    subjectChipBar.style.display = "flex";
  }

  function getFilteredItems() {
    var q = state.query.trim().toLowerCase();
    return state.allItems.filter(function (p) {
      var tag = p.tag || "BOTH";
      if (state.exam !== "ALL" && tag !== "BOTH" && tag !== state.exam) return false;
      var subj = p.subject || "Uncategorised";
      if (state.subject !== "ALL" && subj !== state.subject) return false;
      if (!q) return true;
      var meta = SUBJECT_META[subj] || {};
      var hay = [
        p.title, p.titleMl, p.desc, p.file, subj, meta.ml || "", tag
      ].join(" ").toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }

  /* ================= RENDER ================= */
  function buildCardHtml(p, showSubjectBadge) {
    var badgeCls = p.tag === "573" ? "c573" : p.tag === "883" ? "c883" : "";
    var badgeTxt = p.tag === "573" ? "573 only" : p.tag === "883" ? "883 only" : "BOTH";
    var title    = p.title || titleFromFilename(p.file);
    var key      = p.key || String(p.file || "").replace(/\.html?$/i, "");
    var rawDate  = getRawUpdated(p);
    var dateText = formatDisplayDate(rawDate);
    var subj     = p.subject || "Uncategorised";
    var sMeta    = SUBJECT_META[subj] || { icon: "📄" };
    var descHtml = (p.titleMl ? esc(p.titleMl) : "") +
                   (p.titleMl && p.desc ? "<br>" : "") +
                   (p.desc ? esc(p.desc) : "");

    return '<a href="' + safeHref(p.file) + '" class="card" data-part="' + esc(key) + '" data-file="' + esc(p.file) + '" data-total="' + (p.qs || 0) + '">' +
      '<div class="card-badges">' +
        '<div style="display:flex;gap:.35rem;flex-wrap:wrap">' +
          '<span class="badge ' + badgeCls + '">' + (p.qs || 0) + ' Qs</span>' +
          (showSubjectBadge ? '<span class="badge subj-pill">' + sMeta.icon + ' ' + esc(subj) + '</span>' : '') +
        '</div>' +
        (isRecent(rawDate) ? '<span class="badge new-pill">NEW</span>' : '') +
      '</div>' +
      '<h3>📄 ' + esc(title) + '</h3>' +
      '<div class="file-name" title="' + esc(p.file) + '">📁 ' + esc(p.file) + '</div>' +
      '<p class="desc">' + descHtml + '</p>' +
      '<div class="meta">' +
        (p.duration ? '<span>⏱ ' + p.duration + ' min</span>' : '') +
        (dateText ? '<span title="' + esc(rawDate) + '">📅 ' + esc(dateText) + '</span>' : '') +
        '<span>' + badgeTxt + '</span>' +
      '</div>' +
      '<div class="bar"><i style="width:0%"></i></div>' +
      '<div class="progressline"><span class="status">Not started</span><span class="score"></span></div>' +
    '</a>';
  }

  function renderView() {
    var all = state.allItems;
    if (!all.length) {
      if (visibleCountEl) visibleCountEl.textContent = "0 Papers";
      host.innerHTML =
        '<div class="empty-msg">' +
        'No subject-wise papers yet.<br><br>' +
        'Save your subject mock tests inside <code>question-papers/subjects/</code> — they appear here automatically.' +
        '</div>';
      return;
    }

    var items = getFilteredItems();
    var cmp = comparator(state.sort);

    if (visibleCountEl) {
      visibleCountEl.textContent = items.length === all.length
        ? items.length + " Paper" + (items.length === 1 ? "" : "s")
        : items.length + " of " + all.length;
    }

    if (collapseTools) {
      collapseTools.style.display = state.view === "grouped" ? "inline-flex" : "none";
    }

    if (!items.length) {
      host.innerHTML =
        '<div class="empty-msg">' +
        'No mock tests match your current search or filter.<br><br>' +
        '<button type="button" class="btn" id="resetFiltersBtn">Reset filters</button>' +
        '</div>';
      var resetBtn = document.getElementById("resetFiltersBtn");
      if (resetBtn) {
        resetBtn.addEventListener("click", function () {
          state.query = "";
          state.exam = "ALL";
          state.subject = "ALL";
          if (searchInput) searchInput.value = "";
          if (clearSearchBtn) clearSearchBtn.classList.remove("show");
          document.querySelectorAll("[data-exam]").forEach(function (b) {
            b.classList.toggle("active", b.dataset.exam === "ALL");
          });
          renderSubjectChips(state.allItems);
          renderView();
        });
      }
      return;
    }

    if (state.view === "flat") {
      var sortedFlat = items.slice().sort(cmp);
      host.innerHTML = '<div class="grid">' +
        sortedFlat.map(function (p) { return buildCardHtml(p, true); }).join("") +
      '</div>';
    } else {
      var groups = {};
      items.forEach(function (p) {
        var subj = p.subject || "Uncategorised";
        if (!groups[subj]) groups[subj] = [];
        groups[subj].push(p);
      });

      var sortedSubjects = sortSubjectNames(Object.keys(groups));
      var html = "";

      sortedSubjects.forEach(function (subj) {
        var meta = SUBJECT_META[subj] || { icon: "📄", ml: "" };
        var papers = groups[subj].slice().sort(cmp);
        var isCollapsed = !!state.collapsed[subj];

        html +=
          '<div class="subj-block' + (isCollapsed ? " collapsed" : "") + '" data-subj-block="' + esc(subj) + '">' +
            '<div class="subj-head" role="button" tabindex="0" aria-expanded="' + (isCollapsed ? "false" : "true") + '">' +
              '<span class="ico">' + meta.icon + '</span>' +
              '<h3>' + esc(subj) + '</h3>' +
              (meta.ml ? '<span class="ml">· ' + esc(meta.ml) + '</span>' : '') +
              '<span class="cnt">' + papers.length + ' paper' + (papers.length === 1 ? '' : 's') + '</span>' +
              '<span class="arw">▾</span>' +
            '</div>' +
            '<div class="grid">' +
              papers.map(function (p) { return buildCardHtml(p, false); }).join("") +
            '</div>' +
          '</div>';
      });

      host.innerHTML = html;
    }

    if (!window.__kpscSectionsLoaded) {
      window.__kpscSectionsLoaded = true;
      var s = document.createElement("script");
      s.src = "../assets/js/sections.js";
      document.body.appendChild(s);
    }
  }

  function render(items) {
    state.allItems = (items || []).slice();
    updateHeroStats(state.allItems);
    renderSubjectChips(state.allItems);
    renderView();
  }

  /* ================= INTERACTIONS ================= */
  host.addEventListener("click", function (e) {
    var head = e.target.closest(".subj-head");
    if (!head) return;
    var block = head.closest(".subj-block");
    var subj = block.dataset.subjBlock;
    state.collapsed[subj] = !state.collapsed[subj];
    block.classList.toggle("collapsed", !!state.collapsed[subj]);
    head.setAttribute("aria-expanded", state.collapsed[subj] ? "false" : "true");
  });

  host.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var head = e.target.closest(".subj-head");
    if (!head) return;
    e.preventDefault();
    head.click();
  });

  if (searchInput) {
    searchInput.addEventListener("input", function (e) {
      state.query = e.target.value;
      if (clearSearchBtn) clearSearchBtn.classList.toggle("show", !!state.query);
      renderView();
    });
  }

  if (clearSearchBtn) {
    clearSearchBtn.addEventListener("click", function () {
      state.query = "";
      searchInput.value = "";
      clearSearchBtn.classList.remove("show");
      renderView();
      searchInput.focus();
    });
  }

  if (sortSelect) {
    sortSelect.addEventListener("change", function () {
      state.sort = sortSelect.value;
      renderView();
    });
  }

  if (viewSwitch) {
    viewSwitch.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-view]");
      if (!btn) return;
      state.view = btn.dataset.view;
      viewSwitch.querySelectorAll("[data-view]").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
      renderView();
    });
  }

  document.querySelectorAll("[data-exam]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.exam = btn.dataset.exam;
      document.querySelectorAll("[data-exam]").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
      renderView();
    });
  });

  if (subjectChipBar) {
    subjectChipBar.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-subject]");
      if (!btn) return;
      state.subject = btn.dataset.subject;
      subjectChipBar.querySelectorAll("[data-subject]").forEach(function (b) {
        b.classList.toggle("active", b === btn);
      });
      renderView();
    });
  }

  if (expandAllBtn) {
    expandAllBtn.addEventListener("click", function () {
      state.collapsed = {};
      renderView();
    });
  }

  if (collapseAllBtn) {
    collapseAllBtn.addEventListener("click", function () {
      state.collapsed = {};
      state.allItems.forEach(function (p) {
        state.collapsed[p.subject || "Uncategorised"] = true;
      });
      renderView();
    });
  }

  if (randomBtn) {
    randomBtn.addEventListener("click", function () {
      var pool = getFilteredItems();
      if (!pool.length) return;
      var pick = pool[Math.floor(Math.random() * pool.length)];
      var subj = pick.subject || "Uncategorised";
      if (state.view === "grouped" && state.collapsed[subj]) {
        state.collapsed[subj] = false;
        renderView();
      }

      var title = pick.title || titleFromFilename(pick.file);
      pickText.innerHTML = '🎲 Random pick: <b>' + esc(title) + '</b> <span style="opacity:.75">(' + esc(subj) + ' · ' + esc(pick.file) + ')</span>';
      pickOpenLink.href = safeHref(pick.file);
      pickBanner.classList.add("show");

      var cards = host.querySelectorAll(".card");
      cards.forEach(function (c) { c.classList.remove("picked-flash"); });
      for (var i = 0; i < cards.length; i++) {
        if (cards[i].getAttribute("data-file") === pick.file) {
          cards[i].classList.add("picked-flash");
          cards[i].scrollIntoView({ behavior: "smooth", block: "center" });
          break;
        }
      }
    });
  }

  if (pickCloseBtn) {
    pickCloseBtn.addEventListener("click", function () {
      pickBanner.classList.remove("show");
      host.querySelectorAll(".card.picked-flash").forEach(function (c) {
        c.classList.remove("picked-flash");
      });
    });
  }

  /* ================= LOAD ================= */
  var supplementTried = false;
  async function supplement(local, force) {
    if (supplementTried || !local.length) return;
    supplementTried = true;
    try {
      var repo  = detectRepo();
      var files = await fetchFolderList();
      var known = {};
      local.forEach(function (p) { known[p.file] = 1; });
      var extra = files.filter(function (f) { return !known[f.name]; });
      if (!extra.length) return;

      var metas = await Promise.all(extra.map(function (f) {
        return readMeta(f.name, force, repo);
      }));
      var merged = local.concat(extra.map(function (f, i) {
        var m = metas[i] || {};
        return {
          file:     f.name,
          title:    m.title,
          titleMl:  m.titleMl,
          desc:     m.desc,
          duration: m.duration,
          qs:       m.qs,
          key:      m.key,
          subject:  m.subject || "Uncategorised",
          tag:      m.tag || "BOTH",
          updated:  m.updated || ""
        };
      }));
      merged.sort(byUpdated);
      render(merged);
    } catch (e) { /* offline or no folder listing available */ }
  }

  async function load(force) {
    host.innerHTML = '<p class="empty">Loading…</p>';
    var local_MOCK_TESTS_SUBJECTS = window.MOCK_TESTS_SUBJECTS;
    if (local_MOCK_TESTS_SUBJECTS && local_MOCK_TESTS_SUBJECTS.length) {
      render(local_MOCK_TESTS_SUBJECTS);
      await supplement(local_MOCK_TESTS_SUBJECTS, force);
      return;
    }
    if (!force) {
      var cached = readCache();
      if (cached) { render(cached); return; }
    }

    try {
      var repo  = detectRepo();
      var files = await fetchFolderList();
      if (!files.length) { render([]); return; }

      var metas = await Promise.all(files.map(function (f) {
        return readMeta(f.name, force, repo);
      }));

      var items = files.map(function (f, i) {
        var m = metas[i] || {};
        return {
          file:     f.name,
          title:    m.title,
          titleMl:  m.titleMl,
          desc:     m.desc,
          duration: m.duration,
          qs:       m.qs,
          tag:      m.tag,
          key:      m.key,
          subject:  m.subject || "Uncategorised",
          updated:  m.updated || ""
        };
      });

      items.sort(byUpdated);
      saveCache(items);
      render(items);

    } catch (err) {
      console.warn("Subject list failed:", err.message);
      host.innerHTML =
        '<div class="empty-msg">' +
        '⚠️ Could not auto-load the paper list.<br>' +
        '<small>' + esc(err.message) + '</small><br><br>' +
        'If you are viewing this locally (file://), open the site on ' +
        '<a href="https://sujeshes-hub.github.io/kerala-psc-suite/">GitHub Pages</a> instead.' +
        '</div>';
    }
  }

  if (refreshBtn) refreshBtn.addEventListener("click", function () {
    try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
    supplementTried = false;
    load(true);
  });

  load(false);
})();
</script>

<script src="../assets/js/sync.js" data-kpsc-sync="1"></script>
</body>
